<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects | jaykzu 🌱</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="monokai-style.css">
    <link rel="stylesheet" href="tv-effect.css">
    <link rel="stylesheet" href="mediaqueries.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="/" class="nav-link">home</a>
            <a href="/projects" class="nav-link">projects</a>
            <a href="/blog" class="nav-link">blog</a>
            <!-- <a href="/log" class="nav-link">log</a> -->
            <a href="/resources" class="nav-link">rss</a>
        </div>
        <div class="navbar-right">
            <div class="search-button" id="search-button">
                <span class="cmd-key">⌘</span>
                <span class="k-key">K</span>
            </div>
        </div>
    </nav>
    
    <!-- Search modal that replaces the navbar when active -->
    <div class="search-modal" id="search-modal">
        <input type="text" class="search-input" placeholder="type something..." id="search-input">
        
        <div class="search-suggestions" id="search-suggestions">
            <!-- Suggestions will be dynamically populated by JavaScript -->
        </div>
        
        <div class="search-navigation-help">
            <div class="nav-help-item">
                <span class="key-indicator">↑</span>
                <span class="key-indicator">↓</span>
                <span>to navigate</span>
            </div>
            <div class="nav-help-item">
                <span class="key-indicator">↵</span>
                <span>to confirm</span>
            </div>
        </div>
    </div> 

    <section class="second">
        <div class="about-me">
            <p>no peeking, i'm in development 👀</p>
        </div>
    </section>

    <script src="script.js" defer></script>
    <script src="tv-effect.js" defer></script>
    <script src="search.js" defer></script>
</body>
</html>
